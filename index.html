<title>玥鳴的 iPAS 融合課本</title>
<style>
:root{--bg:#f4f0ea;--paper:#fffdf9;--card:#fff;--text:#312c28;--muted:#746c65;--line:#d8ccc2;--accent:#a86150;--accent-soft:#f3ddd5;--green:#4e7358;--green-soft:#e2ece5;--blue:#60798c;--blue-soft:#e4ebf0;--warn:#8c662b;--warn-soft:#f5e8cb;--shadow:0 10px 30px rgba(70,52,42,.10);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--paper);border-right:1px solid var(--line);padding:20px}.brand{font-size:20px;font-weight:900;line-height:1.35}.sub{font-size:12px;color:var(--muted);line-height:1.65;margin:6px 0 16px}.notice{font-size:12px;line-height:1.65;background:#f8eee8;border-radius:12px;padding:11px 12px;margin-bottom:14px}.chapters{display:grid;gap:5px}.chapter{border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:10px;color:var(--text);line-height:1.45}.chapter:hover{background:#f5ece6}.chapter.active{background:var(--accent-soft);font-weight:800}
main{min-width:0}.top{position:sticky;top:0;z-index:20;background:rgba(244,240,234,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px 22px}.top h1{font-size:23px;margin:0}.subtitle{font-size:13px;color:var(--muted);margin-top:5px}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.toolbar input,.toolbar button{border:1px solid #d4c7bc;background:#fff;border-radius:10px;padding:9px 11px}.toolbar input{flex:1;min-width:220px}.toolbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.progress{font-size:12px;color:var(--muted);align-self:center;margin-left:auto}
.content{padding:28px 28px 100px;max-width:1080px;margin:0 auto}.hero{background:linear-gradient(135deg,#fffdf9,#f8eee8);border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:18px;box-shadow:var(--shadow)}.heroCode{font-size:12px;color:var(--accent);font-weight:800}.hero h2{margin:6px 0 8px;font-size:28px}.hero p{margin:0;color:var(--muted);line-height:1.7}.heroMeta{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.pill{font-size:11px;border-radius:999px;padding:5px 8px;background:#eee7e1;color:#675e57}.pill.main{background:var(--green-soft);color:#385943}.pill.note{background:var(--blue-soft);color:#4d6373}.pill.wait{background:var(--warn-soft);color:#76531d}
.tree{display:grid;gap:12px}.node{background:var(--card);border:1px solid #dfd5cd;border-radius:17px;overflow:hidden;box-shadow:0 6px 18px rgba(70,52,42,.07)}.node.search-hit{outline:4px solid rgba(188,139,65,.22);border-color:#bb8f4d}.nodeHeader{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;padding:15px}.toggle{width:34px;height:34px;border:1px solid #d7c9be;background:#fbf5f1;border-radius:10px;color:var(--accent);font-weight:900}.toggle.blank{visibility:hidden}.nodeCode{font-size:11px;color:var(--muted);font-weight:700}.nodeTitle{font-size:17px;font-weight:900;line-height:1.4;margin-top:2px}.nodeSummary{font-size:13px;color:var(--muted);line-height:1.6;margin-top:5px}.check{width:21px;height:21px;accent-color:var(--green)}.detail{display:none;border-top:1px solid #eee5de;padding:15px 17px 17px}.detail.open{display:block}.source{font-size:12px;color:var(--muted);margin-bottom:10px}.text{white-space:pre-wrap;line-height:1.82;font-size:14px}.detail table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}.detail th,.detail td{border:1px solid #d9cdc3;padding:9px;vertical-align:top;text-align:left}.detail th{background:#f7eee8}.imgBtn{display:block;border:0;background:transparent;padding:0;margin:12px auto 0;max-width:100%}.imgBtn img{display:block;max-width:100%;max-height:520px;border-radius:12px;border:1px solid #ddd1c7;box-shadow:var(--shadow)}.children{display:none;padding:0 13px 13px 34px;position:relative}.children.open{display:grid;gap:10px}.children:before{content:"";position:absolute;left:17px;top:0;bottom:18px;border-left:2px solid #dfd1c6}.children>.node{position:relative}.children>.node:before{content:"";position:absolute;left:-18px;top:26px;width:18px;border-top:2px solid #dfd1c6}
.empty{background:#fff;border:1px dashed #cdbdaf;border-radius:18px;padding:28px;line-height:1.8;color:var(--muted)}.empty strong{color:var(--text)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(25,22,20,.86);display:none;align-items:center;justify-content:center;padding:22px}.modal.open{display:flex}.modal img{max-width:96vw;max-height:92vh;border-radius:12px}.closeModal{position:absolute;right:18px;top:14px;border:0;background:#fff;color:#222;width:42px;height:42px;border-radius:50%;font-size:25px}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}.chapters{display:flex;overflow:auto}.chapter{min-width:210px;background:#fff;border:1px solid #e3d8cf}.top{top:0;padding:13px 15px}.top h1{font-size:19px}.content{padding:18px 14px 80px}.hero{padding:19px}.hero h2{font-size:23px}.nodeHeader{grid-template-columns:auto 1fr}.check{grid-column:2;justify-self:end;margin-top:-32px}.children{padding-left:23px}.children:before{left:10px}.children>.node:before{left:-13px;width:13px}.progress{width:100%;margin-left:0}.toolbar input{min-width:100%}}

<script>
const DATA={"01":{"id":"01","title":"第1章｜AI 的定義、發展與分類","tree":{"code":"第1章","title":"AI 的定義、發展與分類","source":"全華課本｜前段 7109–7115＋原網站已收錄頁面 7245–7252","status":"目前已整合內容","summary":"從圖靈測試、三波發展、規則式系統、機器學習、神經網路、深度學習到生成式 AI。","children":[{"code":"快速複習","title":"第 1 章考場反射","source":"全華課本＋融合整理","status":"複習捷徑","summary":"先抓關鍵字，再回到完整內容。","children":[{"code":"1950","title":"圖靈測試","source":"全華課本","status":"必背","summary":"1950、Alan Turing、文字對話、分不出人與機器。","text":"看到 1950、文字對話、測試員分辨人或電腦 → 圖靈測試。","children":[]},{"code":"1956","title":"達特茅斯會議","source":"全華課本","status":"必背","summary":"AI 一詞正式提出，成為獨立研究領域。","text":"看到 1956、John McCarthy、AI 一詞正式提出 → 達特茅斯會議。","children":[]},{"code":"三波","title":"三波人工智慧發展","source":"全華課本","status":"必背","summary":"規則式 → 專家系統 → 機器學習與深度學習。","text":"第一波：1950–1970 年代，規則式。\n第二波：1980–1990 年代初期，專家系統。\n第三波：1990 年代中期至今，機器學習與深度學習。","children":[]},{"code":"技術線","title":"四段技術演進","source":"全華課本","status":"必背","summary":"規則式 → 機器學習 → 深度學習 → 生成式 AI。","text":"歷史三波與技術四段是兩種不同整理角度，不要混成同一張年代表。","children":[]},{"code":"比較","title":"規則式 AI vs 機器學習","source":"全華課本","status":"易錯","summary":"人寫規則 vs 從資料學規律。","text":"規則式 AI：知識庫＋IF–THEN＋推論引擎，可解釋但難維護。\n機器學習：大量資料＋模型訓練，能適應複雜模式。","children":[]},{"code":"三層","title":"神經網路三層","source":"全華課本","status":"必背","summary":"輸入層、隱藏層、輸出層。","text":"輸入收資料；隱藏做處理；輸出給結果。","children":[]},{"code":"生成","title":"鑑別式 vs 生成式","source":"全華課本","status":"易錯","summary":"分類判斷 vs 產生新內容。","text":"垃圾郵件分類是鑑別式；依提示生成文章或圖片是生成式。","children":[]}]},{"code":"補充","title":"AI 能力分類：ANI、AGI、ASI","source":"兩份筆記補充｜非本次課本前段主線","status":"補充","summary":"目前商用 AI 幾乎皆為狹義 AI。","text":"ANI（狹義 AI）：專注特定任務，目前實際應用主流。\nAGI（通用 AI）：可跨領域學習與推理，目前沒有公認已實現的系統。\nASI（超級 AI）：全面超越人類智慧的理論概念。\n\n【易錯】ChatGPT 能做很多任務，不等於已達 AGI。","children":[]},{"code":"1-1","title":"人工智慧的發展","source":"全華課本｜本次補入頁面 7109–7112","status":"主教材｜已校對補入","summary":"從 1950 年圖靈測試、1956 年達特茅斯會議，到三波人工智慧發展。","text":"在今日的科技環境中，人工智慧（Artificial Intelligence, AI）已成為產業與教育領域的重要關鍵字。然而，人工智慧並非近幾年才出現的新興技術，而是歷經數十年發展與多次技術突破所累積的成果。\n\n從早期依賴專家規則的系統，到今日能生成文字與圖像的生成式人工智慧，其能力範圍不斷擴展。理解人工智慧的發展脈絡，有助於掌握不同技術的定位與差異，並為後續的應用規劃建立基礎。","children":[{"code":"1-1-1","title":"人工智慧的起源：圖靈測試","source":"全華課本｜頁面 7109／7110","status":"主教材｜已校對補入","summary":"1950 年，艾倫・圖靈提出以文字對話判斷機器能否展現類似人類的智慧。","text":"1950 年，英國數學家及電腦科學家艾倫・圖靈（Alan Turing）提出著名的圖靈測試（Turing Test），用於評估一個機器是否能夠展現人類智慧。\n\n測試時，一名人類測試員單獨在一個房間裡，和身在其他處的另一名人類以及一台電腦進行文字對話，但測試員不知道回答者哪一個是人、哪一個是電腦。經過一連串對話後，測試員必須根據對話內容辨識誰是人、誰是電腦。\n\n若電腦能讓測試員誤以為它是人類，這台電腦就算通過圖靈測試，表示它具備某種程度的智慧。圖靈測試長期被視為測試機器人工智慧的重要標準，對人工智慧的發展產生深遠影響。\n\n【白話】裁判只看文字聊天，分不出哪一邊是電腦，電腦就算過關。\n【考試抓法】題目出現「1950、Alan Turing、僅文字對話、分辨人或機器」→ 圖靈測試。\n【易錯】通過圖靈測試代表對話表現像人，不等於證明機器有意識。","children":[{"code":"圖 1-1","title":"圖靈測試示意圖","source":"全華課本｜頁面 7110","status":"主教材｜教材圖片","summary":"測試員以文字同時與人類及電腦互動，再判斷誰是人類。","image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAKjA0MDASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAAECAwQFBgcI/8QAVRAAAQMCBQEFBQQECwUHAgQHAQIDEQAEBQYSITFBBxNRYXEUIoGRoSMyscEVQlLRFiQzQ2JygpKi4fAINFOywhclRGNz0vE1VCZkg5Oj4nSUJ1WE/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QAJBEBAQEBAAICAgIDAQEAAAAAAAERAgMhEjEEQRMyIkJRYXH/2gAMAwEAAhEDEQA/AOjKiijrRnxNFzWmB9RQFFuTQmKgOBFFLcgakgzxNGfGmbmxt7sAPNJXHBPI9DQPkAyNtjStO21UzuEXbMqw7EX2iDPdvfaoPz3HzpP6QxqwTNxhrd0lPKrVcKP9hX7zQXZREzx0ou7nnk1VW2a8LfV3Tzq7V6Y7q5QW1A+G+3yNW6HmnIWlaSnxBmgaW0CT0imi0ZkgGKkPtC4ZLZWoTtKVQR6VTHD8cs1n2XEmrtr/AId4j3vgtMfUGqqeUeUU0Uwd6hrxq6syRiOFXTaRy7bDv0DzMe8PlT9ri+H4gSLW6acV1SDCh6pO4qBzj0pDkSD8KkaARB2FNrSIG3zqKSnYyYnxoKO0ilFIPINDTuD1mga0nbwpQjmN6WG42JmiUkpkjkUDcEzxttRBIVJ2A4inAjcnrRaDHlQIUkzI+lK98CNRG/jRjjyO9AzO28jrQK9odSfdWYPSh7W+P16RA1UXEmPGgke3vJ390ifCjTiStwpsb0wQNt6bCdSdxv0oLAYkjqg7eFGMQaIAOofCoOmdhQAjcJ5oqyF0yvYrinO/aUfvpFVQQQfzoyk88UFuFoPC0/OjSZHI3qo4MgxQSpQUr3unjQWrgJE/CkgQaru/dTELVRh+4T72rYciKCxG0b0W2ok1AN+6iJMjjilpxBUElAJoJqkSBHFCJj1qJ+kOQUGPKli+QFiUqigklO8+HSjSAB40wi8ZUTJInxFOi6ZVsFgCinj0ouU 宣告人工智慧成為獨立研究領域。\n\n人工智慧的發展並非一路順遂，而是呈現多次起伏與轉折。依全華課本的分法，大致可分為三個發展階段。","children":[{"code":"第一波","title":"1950 年代至 1970 年代：規則式方法","source":"全華課本｜頁面 7111","status":"主教材｜已校對補入","summary":"利用程式語言、演算法與邏輯規則，把人類知識寫進程式。","text":"第一波發展以規則式方法為主。研究者透過邏輯與演算法，將人類知識與思考邏輯轉換為程式，使電腦能進行推理與問題解決。\n\n限制是系統需要依賴大量人工規則，也難以應付複雜情境，最後進入發展停滯期。\n\n【一句話】人先把規則全部寫好，電腦照表操課。"},{"code":"第二波","title":"1980 年代至 1990 年代初期：專家系統","source":"全華課本｜頁面 7112","status":"主教材｜已校對補入","summary":"以專家系統（Expert Systems, ES）為代表，將專業知識系統化。","text":"第二波發展以專家系統（Expert Systems, ES）為代表，強調將專業知識系統化並應用於特定領域，例如醫療診斷與工業決策。\n\n此階段雖在特定應用上取得成果，但仍受到知識取得困難與維護成本高的限制。\n\n【一句話】把專家的判斷方法做成一套電腦系統。"},{"code":"第三波","title":"1990 年代中期至今：機器學習與深度學習","source":"全華課本｜頁面 7112","status":"主教材｜已校對補入","summary":"資料量與運算能力提升，AI 轉向從資料中學習規律。","text":"第三波發展隨著資料量增加與運算能力提升，人工智慧逐漸轉向以機器學習與深度學習為核心的發展模式。透過從資料中學習規律，AI 在語音辨識、影像辨識與自然語言處理等領域皆有突破性進展，並成為目前人工智慧發展的主流方向。\n\n【一句話】不再只靠人寫規則，而是讓模型從大量資料中學。"},{"code":"圖 1-2","title":"人工智慧的三波發展","source":"全華課本｜頁面 7111","status":"主教材｜教材圖片","summary":"第一波規則式、第二波專家系統、第三波機器學習與深度學習。","image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAI/AxsDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAgMAAQQFBgf/xABMEAABAwMDAwMBBAgDBAgEBgMBAAIRAwQhBRIxBkFREyJhcRQygZEVI0JSobHB0QcW4SQzYnIlNEOCkrLw8Rc1U2Nzg5OiwuJEZNL/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/8QAKhEBAQACAQQCAQIGAwAAAAAAAAECEQMEBRIhMUETFVEiIzJCUnFhgaH/2gAMAwEAAhEDEQA/APRWTYg9l2aHwuZY0/bK69FowtYs5NLBgJqFgEIw3K6xyV34RNzgoozJCIAKgYMqQihWBmFQstKHbAlNP3hKEwEC4JQFqbnhVhQKc0qg0d0wkITCACwFDsgpkhUFFUWhwS3NgprnBqHeJhCADBCgaihUcKtBLUG0ApgM5QVDAWaKICDaIKhfxKoO4mMqAAFC3CJztoSjUg57qC3dih2mEUgn6IXPjKKDbHOcoTT5go3PG2VTHDaTOUFGn7cqmiMwrL5APwgZUJwoDY3BwrYASraY4QuqRwEVoY0BNA8JFJ8/TymmptIA4Wa1DmhEAktqgfVNZVEFzoAAkkrDUTblSIUFZr2B7CHNPBGQVe9RVhkqFojhGwiELvMYRVBuBhU5ggqy6AERO4IAFMRlCWweE2AELjHZABblVtAcCETXbuxRH6KBe3PCkJhiZVEYVCw3J KAHLnUbaQVzUgO9RDZZqVqFdQQuupjpOrn0rqzjT/9k=","children":[]},{"code":"練習 1-1","title":"就地練習","source":"全華課本｜頁面 7112","status":"主教材｜題目與答案已核對","summary":"AI 名稱正式提出的事件，以及第二波代表技術。","text":"1.「人工智慧」一詞正式提出於哪一個事件？\n(A) 圖靈測試　(B) 深度學習發展　(C) 達特茅斯會議　(D) 網際網路誕生\n\n2. 第二波人工智慧的代表技術為何？\n(A) 深度學習　(B) 專家系統　(C) 生成式 AI　(D) 自然語言模型","children":[{"code":"答案","title":"練習答案與判斷","source":"全華課本題目｜依課文核對","status":"解題補充","summary":"第 1 題 C；第 2 題 B。","text":"第 1 題：C 達特茅斯會議。1956 年在會議中正式提出 AI 概念。\n第 2 題：B 專家系統。第二波約為 1980 年代至 1990 年代初期。","children":[]}]}]}]},{"code":"1-2","title":"人工智慧的技術演進","source":"全華課本｜本次補入頁面 7113–7115、7106–7107","status":"主教材｜已校對補入並重整層級","summary":"規則式 AI → 機器學習 → 深度學習 → 生成式 AI；後一階段擴展前一階段的能力，而非完全取代。","text":"若從技術角度觀察，人工智慧的發展歷程可整理為不同的發展類型。隨著人工智慧由早期的規則式方法，逐步演進至以資料與模型為核心的技術，其發展不僅呈現在時間上的變化，也可依技術特性加以分類。\n\n人工智慧的技術發展歷程大致可歸納為四種類型。這四種類型並非彼此取代，而是逐步擴展人工智慧的能力，使其從單純的規則推理，發展到能夠學習資料，甚至產生新的內容。\n\n1. 規則式人工智慧（Rule-based AI）：依賴專家撰寫規則進行推理與決策，系統行為由既定邏輯控制。\n2. 機器學習（Machine Learning）：隨資料量增加與運算能力提升，AI 開始從資料中學習規律，不再只依賴人工撰寫規則。\n3. 深度學習（Deep Learning）：透過多層神經網路模型，處理更複雜的資料類型，例如圖像與語音。\n4. 生成式人工智慧（Generative AI）：學習資料分布後，不只能判斷或預測，也能產生文章、圖像與程式碼等新內容。\n\n【總口訣】規則靠人寫 → 機器從資料學 → 深度用多層神經網路 → 生成式 AI 產生新內容。","children":[{"code":"圖 1-3","title":"人工智慧的技術發展歷程","source":"全華課本｜頁面 7113","status":"主教材｜教材圖片","summary":"規則式 AI → 機器學習 → 深度學習 → 生成式 AI。","text":"圖中的年份是簡化的技術主流示意，不能拿來取代表 1-1 的精確關鍵年代表。","image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFjAxsDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAgABAwUGBAcI/8QATRAAAQMCBQIEAwUGAgcGBQQDAQIDEQAEBQYSITFBUQcTImFxgZEUMqGxwRUjQlLR8BZiJDNygqLC4Rc0U5Ky8SVDY3PSCERF4lVkk//EABoBAQEBAQEBAQAAAAAAAAAAAAABAgMFBAb/xAAfEQEBAQEAAwEBAAMAAAAAAAAAARECAxIxIQQFUYH/2gAMAwEAAhEDEQA/AM2dxFANjRmQKFIEmTXxPoPuN+lLeZNSBIIpoApgJH0qdPFRJ3qsxpTCEF0ONLebEhld6pnUPgFAT8aovEgqG2/4xSLzNsUruHmmUkhIU4sJBJ6b1ibW9wm3s2FNvW ode":"限制","title":"規則式系統的限制","source":"全華課本｜頁面 7106／7115","status":"主教材｜重點整理","summary":"情境愈複雜、資料愈龐大，規則數量與維護成本愈難控制。","text":"• 難以事先列出所有可能情境。\n• 規則數量增加後，維護成本極高。\n• 系統本身無法隨資料增加而自動改進。\n\n換言之，規則式人工智慧的能力取決於「人類能寫出多少規則」，而不是系統本身的學習能力。隨著應用情境變得複雜，這種方法逐漸顯現限制，進而促成機器學習的出現。\n\n【考試反射】規則明確、流程固定、重視可解釋 → 規則式系統；例外多、資料會持續增加 → 機器學習通常較合適。"}]},{"code":"1-2-2","title":"機器學習","source":"全華課本｜頁面 7106、7115、7107＋原網站既有續頁","status":"主教材｜前後頁已合併","summary":"由規則導向轉為資料驅動：不再逐條寫規則，而是用訓練資料建立模型、歸納模式。","text":"隨著電腦運算能力提升與網際網路普及，資料量呈現爆炸性成長，人工智慧研究逐漸從「規則式方法」轉向「資料驅動（Data-driven）」模式。\n\n此階段的關鍵轉變在於：不再由人類逐條撰寫規則，而是讓電腦從大量資料中學習模式，這種方法即為機器學習（Machine Learning）。\n\n科學家認為，與其告訴機器每一個對應指令，更應該讓機器學會如何識字、自主判斷、歸納規則與自我學習。機器學習系統會透過訓練資料建立模型，並從資料中自動歸納規律。\n\n常見例子：\n• 透過大量郵件資料學習垃圾郵件的特徵。\n• 透過歷史銷售資料預測未來需求。\n• 透過使用者觀看紀錄推薦可能感興趣的影片或商品。\n• 透過過去交易資料偵測異常行為，例如信用卡盜刷。\n\n與早期規則式人工智慧不同，此時人工智慧的核心不再是「規則庫」，而是資料與模型。\n\n【白話】規則式是老師先寫答案規則；機器學習是給電腦大量例題，讓它自己找出判斷方式。\n【考試反射】大量歷史資料、預測／分類／推薦／異常偵測、會隨資料改善 → 機器學習。","children":[{"code":"圖 1-5","title":"規則式 AI 與機器學習 AI 的運作差異","source":"全華課本｜頁面 7107","status":"主教材｜教材圖片與文字化","summary":"規則式：專家知識 → IF–THEN 規則 → 推論引擎；機器學習：大量資料 → 模型學習 → 系統預測。","text":"規則式 AI：專家知識 → IF–THEN 規則 → 推論引擎（Inference Engine）→ 系統判斷。\n\n機器學習：大量資料（Big Data）→ 模型學習 → 系統預測。","image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAHCArIDASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAQIAAwYFBAcI/8QAVBAAAQMDAwIEAwUEBgIPBwQDAQIDEQAEIQUSMQZBEyJRYQdxgRQykaHRFUKxwRYjM1Jy4RdiJCU0NUNEY3OCg5KTotLwJlNUdLLC8WSElOI2VcP/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/xAAnEQEAAgIBBAIDAAMBAQAAAAAAARECAwQFMUFREiETFBUiMmJCYf/aAAwDAQACEQMRAD8A+nVCKnejzW0BIomok0R3oiGpNSpURKBo1DA5oqTU9a8V9rVhp5/2TcttH0Ua8KuttASJ/aLNRHa4onIrgK676fBj9oNfnSq6+6fSM3yPwP6VFpoQDFEiQKzf+kPp8f8AHkn/AKJpFfEfp4cXZPybNBqJqJ59qyh+JegAf7ocPybNKfidoIV/aPf92aDXfKifu5rGr+KWhpBxcn5N/wCdUr+LGjAEBm7PvsA/nSxuDjmiMisGfi5pmYs7sx7J/Wk 數學模型。基本單位為神經元（Neuron），又稱節點（Node）。模型透過大量節點之間的連結與運算，逐步學習資料中的特徵。\n\n神經網路的基本結構包含輸入層、隱藏層與輸出層。訓練時，模型會反覆比較輸出與正確答案，調整各連結的權重，使預測或分類結果逐漸改善。\n\n【白話】輸入層收資料；隱藏層做處理；輸出層給答案。\n【易錯】神經網路不等於深度學習；深度學習通常是使用多層神經網路。","children":[{"code":"圖 1-6","title":"神經網路架構與權重","source":"全華課本｜頁面 7246","status":"主教材｜教材圖片","summary":"輸入層、隱藏層、輸出層之間以權重連接。","text":"所有輸入值可用向量表示；輸入層到隱藏層、隱藏層到輸出層的連結強度可分別形成權值矩陣（Weight Matrix）。","image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAGkAyUDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAgABAwQFBgcI/8QATRAAAQMCBAMFBAYFCQgCAgMBAQACAwQRBRIhMRNBUQYiYXGBFDKR0RUjQlKhsTNicsHhByQ0Q1OCkpPwFiVUY3OD0vE1RKKjRVWy4v/EABoBAQEBAQEBAQAAAAAAAAAAAAABAgMEBQb/xAAnEQEBAAICAQQDAAIDAQAAAAAAAQIRAwRBBRIhMRMUUSIyFUJSof/aAAwDAQACEQMRAD8AxBunk0if4Apmi3NNUSCOmkcbaBeZ0c5SYtVCmbLLL3XSOZe36xAUlfiFVA9kHFOaTRpDR81keyvgdFHICRUscWDkTmJ2TTQyAsbI0lznkNId97krpHc0QmFFBxzeXIC4+KOSZkVs7gLmwunhaY6eKN27WAHzsqOMYd9JRMYHFpY4OuDZQaTTtzWXitZNBX0sMTgBKSCTy0ur8XdaBe9hZZlcx9RjdGIyAWBzrnyskQH0q+kl4cdVxJS9oLSNACbLoaJwZVtMtYHO2yNA1+KwKnCnDFIiXNkMsjBZo6OuVrYXBC/tJWAxNLWxNc0EXAOY6jxXbFzrQxvEp8LpZZXFgYBpqgweerpMPD55A50l3kF3u35BUu2eHmTCnzSPLsrgWsHLXcq7LEWU5DwR3f7Jdo51o0FdUVLZKpronwMBabO1BHJZJ7QVMfDxdzZPY3DLlGtzmsVY7LNydnKg2NzNKTpa+oCxTC2TspRtbI4983Z/fW4jp6GsqZsSqJm53QMaGhgF7u5/JNN2kH0bVVBa5ghfwnF2munP1U9TRmlqo56eXJG0EPiOx8R4rDkoX4j2YxFrLXmqXOHkMo39CqgOznad87pqepnbcvkIJIuADppz3U1LjlZRVLqyZ5kpC7KW27zf1rdFyTKaWBntbTlcJZACDr77f4rZhqamKWqYJLxyShhDtbDKT+YCD0SlqWVtKyeJwLJBcFZOL1U+HyUzeOwcSYNsRyJ+St4K9lPgNE4n+pafwVGbDX47M+Z5LGRD6k9X6i/otJk6K2UabLDxWrnfWsp6Z+V0YzuvzHT1T4LjbZwaSq+rqoe65p5qhjQzdpKYNvpC8kDnpoib+EbMXr68FjC2M5rBxdtrbXzWnhWI1NZUuikaG5LhwJ181zccQbQyTcpKuPnyDrLfhER7WF0TcoFM69uZuEGFUdqcRhqzFZovO6NvkOY+I+C1oMUrX9mamqmIbNG8gabAC6x8XiFRiMPs0Q+rqMzrA72v+5XaNzq178IaWtZKx0hcbjp80HTUGIZ6e779xjS4nYmyx8S7SGpvDRObcmxeTZrPEn9ytYRPPVVFbRTBhZAxrQQdDe/ 條組合成更有意義的局部形狀，例如眼睛、耳朵或物體輪廓。","children":[]},{"code":"高階","title":"最終層：高階特徵","source":"全華課本｜頁面 7248","status":"主教材","summary":"綜合特徵判斷類別。","text":"綜合多層特徵後，判斷整張圖片最可能屬於哪一類，例如貓或狗。","children":[]},{"code":"練習 1-2","title":"就地練習","source":"全華課本｜頁面 7248","status":"主教材｜題目整理","summary":"神經網路基本結構與技術演進順序。","text":"1. 神經網路的基本結構包含哪些層？\n(A) 資料層、模型層、結果層\n(B) 輸入層、隱藏層、輸出層\n(C) 前端層、中間層、後端層\n(D) 感知層、判斷層、輸出層\n\n2. 人工智慧技術演進的正確順序為何？\n(A) 機器學習 → 規則式 AI → 深度學習\n(B) 規則式 AI → 深度學習 → 機器學習\n(C) 規則式 AI → 機器學習 → 深度學習\n(D) 深度學習 → 規則式 AI → 機器學習","children":[{"code":"答案","title":"練習答案","source":"課本題目核對","status":"解題補充","summary":"第 1 題 B；第 2 題 C。","text":"第 1 題：B。\n第 2 題：C。","children":[]}]}]}]},{"code":"1-3","title":"生成式人工智慧（Generative AI）","source":"全華課本｜原網站已收錄頁面 7249–7252","status":"主教材｜已整合","summary":"AI 從分類與預測，進一步發展成能產生新內容的系統。","text":"傳統鑑別式人工智慧主要負責分類、判斷或預測；生成式人工智慧則學習大量資料的分布與模式，進一步產生文字、圖像、程式碼、音訊或影片等新內容。\n\n【核心差異】鑑別式 AI 回答「這是什麼」；生成式 AI 回答「依照學到的模式，產生一個新的內容」。\n【易錯】生成內容不代表一定真實，仍可能出現錯誤或幻覺。","children":[{"code":"1-3-1","title":"生成式 AI 的崛起","source":"全華課本｜頁面 7249–7250","status":"主教材","summary":"資料、模型、算力與大型語言模型共同成熟。","text":"生成式 AI 能崛起，與大量資料累積、深度學習模型進步、運算能力提升，以及大型語言模型（LLM）發展密切相關。它使 AI 從輔助決策工具，逐步成為創作與協作工具。\n\n常見應用包括內容創作、智慧客服、教學輔助與程式開發支援。","children":[{"code":"差異","title":"鑑別式 AI 與生成式 AI","source":"全華課本｜圖 1-9","status":"主教材｜圖表文字化","summary":"一個分類判斷；一個產生新內容。","table":[["類型","主要任務","例子"],["鑑別式 AI","分類、判斷、預測","判斷貓或狗、垃圾郵件、銷售預測"],["生成式 AI","依資料模式產生新內容","文章、圖片、程式碼、對話"]],"children":[]},{"code":"四大原因","title":"生成式 AI 崛起的四大條件","source":"全華課本｜頁面 7250","status":"主教材","summary":"資料＋模型＋算力＋LLM。","text":"1. 大量資料累積。\n2. 深度學習模型進步。\n3. 運算能力提升。\n4. 大型語言模型發展。","children":[]}]},{"code":"1-3-2","title":"生成式 AI 工具","source":"全華課本｜頁面 7251","status":"主教材｜工具分類","summary":"先記類別，再把工具放進正確位置。","children":[{"code":"文字","title":"文字生成","source":"全華課本｜表 1-3","status":"主教材","summary":"ChatGPT、Gemini、Claude。","text":"ChatGPT：對話、文件分析、程式與多模態互動。\nGemini：與 Google 生態整合，支援長上下文。\nClaude：長文本結構化與程式處理。","children":[]},{"code":"圖片","title":"圖片生成","source":"全華課本｜表 1-3","status":"主教材","summary":"DALL·E、Midjourney、Nano Banana、Ideogram。","text":"DALL·E：與 ChatGPT 整合、可對話式修圖。\nMidjourney：藝術美感與精緻圖像。\nNano Banana：整合於 Gemini 的影像生成與編修。\nIdeogram：擅長文字渲染與海報。","children":[]},{"code":"簡報","title":"簡報生成","source":"全華課本｜表 1-3","status":"主教材","summary":"Canva、Gamma。","text":"Canva：整合式設計與 AI 排版。\nGamma：輸入主題後快速生成具文字、排版與配圖的簡報。","children":[]},{"code":"影片","title":"影片生成","source":"全華課本｜表 1-3","status":"主教材","summary":"Runway ML、Kling AI、FlexClip。","text":"Runway ML：影片控制與多鏡頭合成。\nKling AI：動作與物理表現。\nFlexClip：文字或圖片生成影片與短影音。","children":[]},{"code":"聲音","title":"音樂與聲音","source":"全華課本｜表 1-3","status":"主教材","summary":"Udio、ElevenLabs、Suno AI。","text":"Udio：高品質音樂生成。\nElevenLabs：文字轉語音、多語言與情緒表現。\nSuno AI：可生成歌詞、人聲與完整歌曲。","children":[]}]},{"code":"練習 1-3","title":"本節快速自測","source":"全華課本重點整理","status":"複習題","summary":"辨識生成式與鑑別式 AI。","text":"1. 判斷郵件是否為垃圾郵件，較接近哪一類？\n答案：鑑別式 AI。\n\n2. 根據提示詞產生一張新圖片，較接近哪一類？\n答案：生成式 AI。\n\n3. 生成式 AI 崛起的四個條件？\n答案：資料、模型、算力、LLM。","children":[]}]}]}},"02":{"id":"02","title":"第2章｜AI 治理、偏誤、公平、可信任與可解釋 AI","tree":{"code":"第2章","title":"AI 治理、偏誤、公平、可信任與可解釋 AI","source":"章節總覽｜等待依全華課本逐頁整合","status":"尚未放入本次課本原文","summary":"此入口保留在同一個網站中。之後收到課本頁面時，會直接補進這裡，不另開新網站。","children":[]}},"03":{"id":"03","title":"第3章｜資料概念、型態、來源與大數據","tree":{"code":"第3章","title":"資料概念、型態、來源與大數據","source":"章節總覽｜等待依全華課本逐頁整合","status":"尚未放入本次課本原文","summary":"此入口保留在同一個網站中。之後收到課本頁面時，會直接補進這裡，不另開新網站。","children":[]}},"04":{"id":"04","title":"第4章｜資料整理、清理、ETL、分析與決策","tree":{"code":"第4章","title":"資料整理、清理、ETL、分析與決策","source":"章節總覽｜等待依全華課本逐頁整合","status":"尚未放入本次課本原文","summary":"此入口保留在同一個網站中。之後收到課本頁面時，會直接補進這裡，不另開新網站。","children":[]}},"05":{"id":"05","title":"第5章｜資料隱私、安全與保護技術","tree":{"code":"第5章","title":"資料隱私、安全與保護技術","source":"章節總覽｜等待依全華課本逐頁整合","status":"尚未放入本次課本原文","summary":"此入口保留在同一個網站中。之後收到課本頁面時，會直接補進這裡，不另開新網站。","children":[]}},"06":{"id":"06","title":"第6章｜機器學習基本原理、訓練流程與評估","tree":{"code":"第6章","title":"機器學習基本原理、訓練流程與評估","source":"章節總覽｜等待依全華課本逐頁整合","status":"尚未放入本次課本 let current='01';
const state=JSON.parse(localStorage.getItem('ipas-reading-state')||'{}');
const chapters=document.getElementById('chapters'),content=document.getElementById('content'),search=document.getElementById('search');
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));
function uid(path){return path.join('>')}
function sourceClass(status=''){if(status.includes('等待')||status.includes('尚未'))return 'wait';if(status.includes('補充'))return 'note';return 'main'}
function searchable(n){return [n.code,n.title,n.summary,n.text,n.source,n.status,...(n.table||[]).flat()].join(' ').toLowerCase()}
function nodeHTML(n,path,query=''){
 const id=uid(path),has=(n.children||[]).length>0,done=!!state[id],hit=query&&searchable(n).includes(query);
 const rows=(n.table||[]).map((r,i)=>'<tr>'+r.map(x=>`<${i===0?'th':'td'}>${esc(x)}</${i===0?'th':'td'}>`).join('')+'</tr>').join('');
 const detail=(n.text||n.table||n.image)?`<div class="detail" data-detail="${esc(id)}"><div class="source">來源：${esc(n.source||'')}｜${esc(n.status||'')}</div>${n.text?`<div class="text">${esc(n.text)}</div>`:''}${rows?`<table>${rows}</table>`:''}${n.image?`<button class="imgBtn" data-img="${esc(n.image)}"><img src="${esc(n.image)}" alt="${esc(n.title)}"></button>`:''}</div>`:'';
 const children=has?`<div class="children" data-children="${esc(id)}">${n.children.map((c,i)=>nodeHTML(c,[...path,String(i)],query)).join('')}</div>`:'';
 return `<article class="node ${hit?'search-hit':''}" data-node="${esc(id)}"><div class="nodeHeader"><button class="toggle ${has?'':'blank'}" data-toggle="${esc(id)}">＋</button><div class="nodeMain" data-open-detail="${esc(id)}"><div class="nodeCode">${esc(n.code||'')}</div><div class="nodeTitle">${esc(n.title||'')}</div><div class="nodeSummary">${esc(n.summary||'')}</div><div class="heroMeta"><span class="pill ${sourceClass(n.status)}">${esc(n.status||'內容')}</span></div></div><input class="check" type="checkbox" data-check="${esc(id)}" ${done?'checked':''} aria-label="標記完成"></div>${detail}${children}</article>`
}
function renderChapters(){chapters.innerHTML=Object.values(DATA).map(ch=>`<button class="chapter ${ch.id===current?'active':''}" data-chapter="${ch.id}">${esc(ch.title)}</button>`).join('')}
function render(){
 const ch=DATA[current],q=search.value.trim().toLowerCase();
 document.getElementById('pageTitle').textContent=ch.title;
 document.getElementById('pageSub').textContent=ch.tree.source||'';
 let body='';
 if(current==='01') body=`<section class="hero"><div class="heroCode">${esc(ch.tree.code)}</div><h2>${esc(ch.tree.title)}</h2><p>${esc(ch.tree.summary)}</p><div class="heroMeta"><span class="pill main">${esc(ch.tree.status)}</span></div></section><section class="tree">${(ch.tree.children||[]).map((n,i)=>nodeHTML(n,[current,String(i)],q)).join('')}</section>`;
 else body=`<section class="hero"><div class="heroCode">${esc(ch.tree.code)}</div><h2>${esc(ch.tree.title)}</h2><p>${esc(ch.tree.summary)}</p><div class="heroMeta"><span class="pill wait">${esc(ch.tree.status)}</span></div></section><div class="empty"><strong>這個章節入口已保留在同一個網站。</strong><br>目前尚未把全華課本原文放進這一章。之後新增內容時，會直接更新這個入口，不另開第二個網站。</div>`;
 content.innerHTML=body;renderChapters();bind();updateProgress();
 if(q){document.querySelectorAll('.search-hit').forEach(n=>{let p=n.parentElement;while(p&&p!==content){if(p.classList.contains('children'))p.classList.add('open');p=p.parentElement}})}
}
function bind(){
 document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const id=b.dataset.toggle,c=document.querySelector(`[data-children="${CSS.escape(id)}"]`);if(!c)return;c.classList.toggle('open');b.textContent=c.classList.contains('open')?'－':'＋'});
 document.querySelectorAll('[data-open-detail]').forEach(x=>x.onclick=()=>{const id=x.dataset.openDetail,d=document.querySelector(`[data-detail="${CSS.escape(id)}"]`);if(d)d.classList.toggle('open')});
 document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{state[x.dataset.check]=x.checked;localStorage.setItem('ipas-reading-state',JSON.stringify(state));updateProgress()});
 document.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>{document.getElementById('modalImg').src=b.dataset.img;document.getElementById('modal').classList.add('open')});
}
function updateProgress(){const checks=[...document.querySelectorAll('[data-check]')],done=checks.filter(x=>x.checked).length;document.getElementById('progress').textContent=checks.length?`本章完成 ${done}/${checks.length}`:''}
chapters.addEventListener('click',e=>{const b=e.target.closest('[data-chapter]');if(!b)return;current=b.dataset.chapter;search.value='';render();window.scrollTo({top:0})});
search.addEventListener('input',render);document.getElementById('clearSearch').onclick=()=>{search.value='';render()};
document.getElementById('expand').onclick=()=>{document.querySelectorAll('.children,.detail').forEach(x=>x.classList.add('open'));document.querySelectorAll('.toggle:not(.blank)').forEach(x=>x.textContent='－')};
document.getElementById('collapse').onclick=()=>{document.querySelectorAll('.children,.detail').forEach(x=>x.classList.remove('open'));document.querySelectorAll('.toggle:not(.blank)').forEach(x=>x.textContent='＋')};
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};
render();
</script>
